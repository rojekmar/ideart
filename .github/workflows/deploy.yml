name: Deploy (FTP — hosting współdzielony cba.pl)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (bez dev, na hostingu nie ma composera)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Wygeneruj plik .env (na hostingu nie ma jak odpalić artisan)
        run: |
          {
            echo "APP_NAME=\"IDEART\""
            echo "APP_ENV=production"
            echo "APP_KEY=${{ secrets.APP_KEY }}"
            echo "APP_DEBUG=false"
            echo "APP_URL=https://ideart.com.pl"
            echo "APP_LOCALE=pl"
            echo "APP_FALLBACK_LOCALE=en"
            echo "LOG_CHANNEL=stack"
            echo "LOG_LEVEL=error"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "QUEUE_CONNECTION=sync"
            echo "FILESYSTEM_DISK=local"
          } > .env

      - name: Zbuduj strukturę pod hosting bez SSH
        run: |
          mkdir -p deploy_app deploy_public
          shopt -s extglob dotglob
          # Konto FTP na cba.pl nie pozwala tworzyć nowych folderów na
          # najwyższym poziomie — katalogiem domeny jest /ideart.com.pl/
          # (cba.pl nazywa folder domeny jej nazwą, nie "public_html"). Kod
          # aplikacji trafia DO ŚRODKA tego katalogu, w podfolderze ideart-app/,
          # zablokowanym dla przeglądarki przez .htaccess (patrz niżej).
          cp -r !(public|deploy_app|deploy_public|node_modules|tests|.git|.github) deploy_app/
          cp -r public/!(hot) deploy_public/ 2>/dev/null || cp -r public/* deploy_public/

          # .htaccess blokujący bezpośredni dostęp przeglądarki do kodu aplikacji
          {
            echo "<IfModule mod_authz_core.c>"
            echo "    Require all denied"
            echo "</IfModule>"
            echo "<IfModule !mod_authz_core.c>"
            echo "    Order deny,allow"
            echo "    Deny from all"
            echo "</IfModule>"
          } > deploy_app/.htaccess

          # index.php w katalogu publicznym wskazuje na kod aplikacji w
          # PODFOLDERZE ideart-app/ (ta sama głębokość, nie o poziom wyżej —
          # patrz DEPLOY.md, jeśli Twoja struktura na FTP jest inna)
          APP_DIR_NAME="ideart-app"
          sed -i "s#__DIR__.'/../storage/framework/maintenance.php'#__DIR__.'/${APP_DIR_NAME}/storage/framework/maintenance.php'#" deploy_public/index.php
          sed -i "s#__DIR__.'/../vendor/autoload.php'#__DIR__.'/${APP_DIR_NAME}/vendor/autoload.php'#" deploy_public/index.php
          sed -i "s#__DIR__.'/../bootstrap/app.php'#__DIR__.'/${APP_DIR_NAME}/bootstrap/app.php'#" deploy_public/index.php

      - name: Zainstaluj lftp (pewniejsze tworzenie katalogów niż akcje JS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wgraj kod aplikacji (do ideart.com.pl/ideart-app/, zablokowany .htaccess)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set ftp:ssl-allow no; set mirror:parallel-transfer-count 3; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mkdir -p /ideart.com.pl/ideart-app; mirror -R --verbose ./deploy_app/ /ideart.com.pl/ideart-app/; bye"

      - name: Wgraj katalog publiczny domeny
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set ftp:ssl-allow no; set mirror:parallel-transfer-count 3; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror -R --verbose --exclude-glob ideart-app/ --exclude-glob assets/grafiki_animacje/ ./deploy_public/ /ideart.com.pl/; bye"
