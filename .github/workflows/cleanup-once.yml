name: Cleanup orphaned root files (one-off)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-once.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Zainstaluj lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Usuń osierocone pliki z /ideart.com.pl (w tym publicznie dostępny .git!)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set ftp:ssl-allow no; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; cd /ideart.com.pl; rm -rf .git .github node_modules tests vendor app bootstrap config database resources routes storage public composer.json composer.lock package.json package-lock.json artisan phpunit.xml vite.config.js .env .env.example .editorconfig .gitattributes .gitignore README.md DEPLOY.md _clear_opcache_xk92.php; ls -la; bye"
